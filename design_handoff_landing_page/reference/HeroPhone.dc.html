<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Hero Phone Screenshot" description="Decoy 'UGC submissions inbox' iPhone screen for the landing hero" -->
<helmet>
<script src="./ds-base.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..800&display=swap" rel="stylesheet">
<style>body{margin:0;background:transparent;display:flex;justify-content:center;padding:24px 0;font-family:'Figtree',-apple-system,sans-serif}</style>
</helmet>
<x-import component="IOSDevice" from="./ios-frame.jsx" hint-size="430px,900px">
<div style="height:100%;background:#F7FAFD;display:flex;flex-direction:column;font-family:'Figtree',-apple-system,sans-serif;color:#0F1720">
<div style="padding:10px 20px 14px;display:flex;align-items:center;justify-content:space-between">
<div style="display:flex;flex-direction:column;gap:2px">
<span style="font-size:13px;font-weight:600;color:#8E9AA6;letter-spacing:0.5px">TUESDAY, AUG 11</span>
<span style="font-size:30px;font-weight:800;letter-spacing:-0.5px">Submissions</span>
</div>
<div style="width:40px;height:40px;border-radius:50%;background:#A7D3F7;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#0B76AD">M</div>
</div>
<div style="margin:0 16px;background:#0F1720;border-radius:20px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between">
<div style="display:flex;flex-direction:column;gap:3px">
<span style="color:#fff;font-size:16px;font-weight:700">12 new submissions</span>
<span style="color:#8E9AA6;font-size:13px;font-weight:500">Waiting for your review</span>
</div>
<span style="background:#1BA6EE;color:#fff;font-size:13px;font-weight:700;padding:9px 16px;border-radius:999px;flex-shrink:0">Review</span>
</div>
<div style="display:flex;align-items:center;justify-content:space-between;margin:18px 20px 8px">
<span style="font-size:16px;font-weight:700">Latest</span>
<span style="font-size:13px;font-weight:600;color:#1BA6EE">View all</span>
</div>
<div style="display:flex;flex-direction:column;gap:8px;margin:0 16px;flex:1">
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
<div style="background:#fff;border:1px solid #E6EEF6;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px">
<div style="width:44px;height:44px;border-radius:50%;background:#E7F4FD;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#0B76AD;flex-shrink:0">{{ r.initials }}</div>
<div style="display:flex;flex-direction:column;gap:2px;flex:1;min-width:0">
<span style="font-size:15px;font-weight:700">{{ r.handle }}</span>
<span style="font-size:12.5px;font-weight:500;color:#8E9AA6">{{ r.meta }}</span>
</div>
<sc-if value="{{ r.approved }}" hint-placeholder-val="{{ false }}">
<span style="font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;background:#E4F5EC;color:#1F8F5F;flex-shrink:0">Approved</span>
</sc-if>
<sc-if value="{{ r.pending }}" hint-placeholder-val="{{ true }}">
<span style="font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;background:#1BA6EE;color:#fff;flex-shrink:0">Approve</span>
</sc-if>
</div>
</sc-for>
</div>
<div style="height:8px"></div>
<div style="background:#fff;border-top:1px solid #E6EEF6;display:flex;padding:10px 12px 30px">
<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:#1BA6EE">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M3 9h18"></path><path d="M8 14h5"></path></svg>
<span style="font-size:11px;font-weight:700">Submissions</span>
</div>
<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:#8E9AA6">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9.5" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
<span style="font-size:11px;font-weight:600">Creators</span>
</div>
<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:#8E9AA6">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
<span style="font-size:11px;font-weight:600">Profile</span>
</div>
</div>
</div>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:480,&quot;height&quot;:950}}">
class Component extends DCLogic {
  renderVals() {
    return {
      rows: [
        { initials: "JR", handle: "@jasmine.rae", meta: "Video · 0:24 · 9:41 AM", approved: false, pending: true },
        { initials: "TK", handle: "@tommy.k", meta: "Video · 0:31 · 9:12 AM", approved: false, pending: true },
        { initials: "MS", handle: "@maya.films", meta: "Photo set · 4 stills · 8:47 AM", approved: false, pending: true },
        { initials: "DL", handle: "@dan.creates", meta: "Video · 0:18 · 8:02 AM", approved: true, pending: false },
        { initials: "AC", handle: "@ava.content", meta: "Video · 0:42 · Yesterday", approved: true, pending: false }
      ]
    };
  }
}
</script>
</body>
</html>
